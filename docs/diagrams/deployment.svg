<svg viewBox="0 0 896 564" xmlns="http://www.w3.org/2000/svg">
<defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0 0L7 3L0 6z" fill="#475569"/></marker>
    <marker id="aha" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0 0L7 3L0 6z" fill="#B27708"/></marker>
    <marker id="ahc" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0 0L7 3L0 6z" fill="#0E7490"/></marker>
    <marker id="ahs" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0 0L7 3L0 6z" fill="#9AA6B5"/></marker>
  </defs>
<rect x="1" y="1" width="894" height="562" rx="16" fill="#FBFCFD" stroke="#E6E9EF"/>
<rect x="272" y="40" width="320" height="446" rx="14" fill="#0B1220"/>
<text x="24" y="46" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#5B6675" letter-spacing="1">EXTERNAL DATA</text><rect x="24" y="60" width="220" height="124" rx="10" fill="#fff" stroke="#DCE6EA" stroke-width="1.8"/><text x="38" y="83.155" text-anchor="start" font-family="'Sora', ui-sans-serif, sans-serif" font-weight="700" font-size="11.5" fill="#1B2433">6 keyless public APIs</text><text x="38" y="101.2025" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#374559">UN Comtrade</text><text x="38" y="115.25250000000001" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#374559">World Bank</text><text x="38" y="129.3025" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#374559">ISRIC SoilGrids</text><text x="38" y="143.35250000000002" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#374559">NASA POWER</text><text x="38" y="157.40250000000003" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#374559">Open-Meteo</text><text x="38" y="171.45250000000004" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#374559">NOAA NHC</text><text x="24" y="196" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#9AA6B5">polled over plain HTTPS, no VPN</text><rect x="24" y="223" width="220" height="76" rx="10" fill="none" stroke="#C9963A" stroke-width="1.8" stroke-dasharray="3 3"/><text x="38" y="242.2" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#8A6318">NOT BUILT</text><text x="38" y="258.11249999999995" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#8A6318">No edge layer — no farm IoT,</text><text x="38" y="272.1624999999999" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#8A6318">port/customs gateway, or cold-chain</text><text x="38" y="286.21249999999986" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#8A6318">sensors</text><text x="288" y="56" text-anchor="start" font-family="'Sora', ui-sans-serif, sans-serif" font-weight="700" font-size="12.5" fill="#EAF1F7">Docker Compose · one host</text><text x="288" y="72" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#7A8CA3">single network namespace — docker-compose.yml</text><rect x="288" y="94" width="288" height="58" rx="10" fill="#101B2C" stroke="#1C2C42" stroke-width="1"/><text x="298" y="112.7125" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#22D3EE">NEXUS-GRID APP</text><text x="298" y="128.235" text-anchor="start" font-family="'Sora', ui-sans-serif, sans-serif" font-weight="600" font-size="10.5" fill="#C7D4E2">Next.js 16, one process, port 5180</text><text x="298" y="140.9675" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.5" fill="#7A8CA3">source caches, agent memory: in-memory singletons</text><line x1="432" y1="152" x2="432" y2="160" stroke="#2C3E56" stroke-width="1.2"/><rect x="288" y="160" width="288" height="58" rx="10" fill="#101B2C" stroke="#1C2C42" stroke-width="1"/><text x="298" y="178.7125" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#22D3EE">OPENCLAW GATEWAY</text><text x="298" y="194.235" text-anchor="start" font-family="'Sora', ui-sans-serif, sans-serif" font-weight="600" font-size="10.5" fill="#C7D4E2">separate long-running process</text><text x="298" y="206.9675" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.5" fill="#7A8CA3">WebSocket control plane, port 18789</text><rect x="288" y="230" width="288" height="60" rx="9" fill="#0E1B2C" stroke="#1C2C42"/><text x="300" y="246" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="8.5" fill="#C7D4E2">Same namespace on purpose: a shared-token connection is granted</text><text x="300" y="259" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="8.5" fill="#C7D4E2">operator scopes only from 127.0.0.1 — reached by service name</text><text x="300" y="272" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="8.5" fill="#C7D4E2">across a network, auth succeeds and nothing is granted.</text><rect x="288" y="300" width="288" height="42" rx="10" fill="#101B2C" stroke="#1C2C42" stroke-width="1"/><text x="298" y="317.7125" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#22D3EE">.nexus-grid/checkpoints.sqlite</text><text x="298" y="331.24999999999994" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#7A8CA3">the only state that survives a restart</text><line x1="288" y1="356" x2="576" y2="356" stroke="#1C2C42" stroke-width="1"/><text x="288" y="372" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="8.5" fill="#8DA0B5">Without the gateway configured: `npm run dev`, one bare Node process —</text><text x="288" y="385" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="8.5" fill="#8DA0B5">execute reports dispatch as "unconfigured," never fakes a delivery.</text><rect x="288" y="412" width="288" height="60" rx="9" fill="none" stroke="#C9963A" stroke-dasharray="3 3"/><text x="298" y="427" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#D4A24C">NOT BUILT</text><text x="298" y="442" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="8.5" fill="#D4A24C">Kubernetes · multi-region · autoscaling — this is one process, one</text><text x="298" y="455" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="8.5" fill="#D4A24C">host.</text><text x="652" y="46" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#5B6675" letter-spacing="1">CLIENTS</text><rect x="652" y="60" width="220" height="76" rx="10" fill="#fff" stroke="#22D3EE" stroke-width="1.6"/><text x="664" y="84.125" text-anchor="start" font-family="'Sora', ui-sans-serif, sans-serif" font-weight="700" font-size="12.5" fill="#0B1220">Browser</text><text x="664" y="99.95" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#6B7686">the operator console</text><text x="664" y="111.8375" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.5" fill="#9AA6B5">the only client — no sign-in</text><text x="664" y="123.5875" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.5" fill="#9AA6B5">identity belongs to the host system</text><rect x="652" y="158" width="220" height="88" rx="10" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.6"/><text x="664" y="182.125" text-anchor="start" font-family="'Sora', ui-sans-serif, sans-serif" font-weight="700" font-size="12.5" fill="#0B1220">OpenClaw Control UI</text><text x="664" y="197.95" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#92400E">separate surface, same gateway</text><text x="664" y="209.83749999999998" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.5" fill="#9AA6B5">approved/modified plans land here</text><text x="664" y="221.58749999999998" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.5" fill="#9AA6B5">via chat.inject — no outbound channel</text><text x="664" y="233.33749999999998" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.5" fill="#9AA6B5">and no agent run of its own</text><rect x="652" y="268" width="220" height="90" rx="11" fill="none" stroke="#C9963A" stroke-dasharray="3 3"/><text x="664" y="288" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#8A6318">NOT BUILT</text><text x="664" y="304" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="8.5" fill="#8A6318">Farmer/buyer mobile app,</text><text x="664" y="317" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="8.5" fill="#8A6318">SMS/WhatsApp, partner/gov</text><text x="664" y="330" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="8.5" fill="#8A6318">API beyond the documented</text><text x="664" y="343" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="8.5" fill="#8A6318">REST routes + X-Actor header</text><line x1="244" y1="122" x2="272" y2="122" stroke="#9AA6B5" stroke-width="1.6" marker-end="url(#ahs)"/><line x1="592" y1="98" x2="652" y2="98" stroke="#9AA6B5" stroke-width="1.6" marker-end="url(#ahs)"/><path d="M576 189 C 606 194.2, 602 182, 652 202" fill="none" stroke="#FBBF24" stroke-width="1.6" marker-end="url(#ahs)"/><text x="448" y="516" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#7A8696">Fig. 6 — One host, one Compose file, two containers sharing a network namespace for one reason: loopback-only auth.</text><text x="448" y="532" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#7A8696">The vision doc's Kubernetes cluster, edge gateways, and mobile/SMS clients are not part of the shipped topology.</text>
</svg>
