art" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#B27708">urgent &amp;</text><text x="480" y="390" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#B27708">gate required</text><path d="M502 467 C 462 507, 268 464, 278 472" fill="none" stroke="#B45309" stroke-width="1.6" marker-end="url(#ah)"/><line x1="278" y1="438" x2="278" y2="472" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><text x="284" y="458" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#5B6675">otherwise</text><rect x="110" y="472" width="336" height="72" rx="10" fill="#fff" stroke="#2DD4BF" stroke-width="1.8"/><circle cx="126" cy="491.305" r="4" fill="#2DD4BF"/><text x="134" y="497.61" text-anchor="start" font-family="'Sora', ui-sans-serif, sans-serif" font-weight="700" font-size="13" fill="#0B1220">execute</text><text x="134" y="516.0925" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#0D9488">→ OpenClaw dashboard · chat.inject</text><text x="134" y="529.63" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#6B7686">approved / modified only — rejected and escalated are not sent</text><line x1="278" y1="544" x2="278" y2="566" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><rect x="110" y="566" width="336" height="72" rx="10" fill="#fff" stroke="#FB923C" stroke-width="1.8"/><circle cx="126" cy="585.3050000000001" r="4" fill="#FB923C"/><text x="134" y="591.61" text-anchor="start" font-family="'Sora', ui-sans-serif, sans-serif" font-weight="700" font-size="13" fill="#0B1220">monitor</text><text x="134" y="610.0925" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#C2410C">→ Climate Risk agent</text><text x="134" y="623.63" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#6B7686">disruption = climate_risk in {high, severe}</text><rect x="110" y="672" width="336" height="58" rx="10" fill="#fff" stroke="#94A3B8" stroke-width="1.8"/><circle cx="126" cy="691.3050000000001" r="4" fill="#94A3B8"/><text x="134" y="697.61" text-anchor="start" font-family="'Sora', ui-sans-serif, sans-serif" font-weight="700" font-size="13" fill="#0B1220">recover</text><text x="134" y="715.58" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#475569">records gate outcome, delivery status, follow-up</text><line x1="278" y1="638" x2="278" y2="672" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><text x="284" y="658" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" fill="#5B6675">no disruption, or replan cap reached</text><path d="M110 602 C 64 602, 64 214, 110 214" fill="none" stroke="#D9920A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aha)"/><text transform="rotate(-90 72 408)" x="72" y="408" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.5" fill="#B27708">climate risk high/severe → re-plan (max 1×) → assess</text><line x1="278" y1="730" x2="278" y2="752" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><rect x="254.1" y="752" width="47.8" height="28" rx="14" fill="#0B1220"/><text x="278" y="770.125" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#22D3EE">END</text><rect x="20" y="810" width="700" height="128" rx="10" fill="#F6F8FA" stroke="#E6E9EF"/><text x="36" y="832" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.5" fill="#5B6675" letter-spacing="1">LEGEND</text><line x1="36" y1="848" x2="70" y2="848" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><text x="78" y="851" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="10.5" fill="#3A4658">deterministic edge</text><line x1="195.885" y1="848" x2="229.885" y2="848" stroke="#D9920A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aha)"/><text x="237.885" y="851" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="10.5" fill="#3A4658">conditional edge (needsApproval / routeAfterMonitor)</text><text x="36" y="872" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="10.5" fill="#3A4658">8 real LangGraph nodes — every specialist call happens inside a node, not in a separate lane before routing.</text><text x="36" y="890" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="10.5" fill="#3A4658">Agronomy also runs outside this graph entirely, via the independent event/supervisor path shown in Fig. 1.</text><text x="36" y="908" text-anchor="start" font-family="'IBM Plex Sans', ui-sans-serif, sans-serif" font-size="10.5" fill="#3A4658">Source: src/lib/server/workflows/supply-chain-graph.ts — buildGraph().</text>
