start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.5" fill="#B27708">urgent &amp;</text><text x="515" y="135" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.5" fill="#B27708">gate req'd</text><path d="M481.9 133.9 Q 522.2 265.1, 642.1 334.1" fill="none" stroke="#5B6675" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#ahs)"/><text x="501.99" y="269.08" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.5" fill="#5B6675">otherwise</text><line x1="621.772527587296" y1="224.7653646266728" x2="656.227472412704" y2="333.2346353733272" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><line x1="651.312403387617" y1="394.5050083487955" x2="602.687596612383" y2="495.4949916512045" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><line x1="515.0775613253552" y1="553.77997663796" x2="492.9224386746448" y2="562.22002336204" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><circle cx="420" cy="345" r="74" fill="#0B1220"/><text x="420" y="329" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" fill="#22D3EE" letter-spacing="1">ONE RUN</text><text x="420" y="345" text-anchor="middle" font-family="'Sora', ui-sans-serif, sans-serif" font-weight="700" font-size="12.5" fill="#EAF1F7">per detected</text><text x="420" y="361" text-anchor="middle" font-family="'Sora', ui-sans-serif, sans-serif" font-weight="700" font-size="12.5" fill="#EAF1F7">sourcing gap</text><text x="420" y="379" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7" fill="#7A8CA3">one LangGraph thread</text><path d="M510.1 442.1 L524.1 427.0 L535.6 409.8 L544.2 391.1 L549.9 371.3 L552.4 350.8 L551.7 330.2 L547.8 309.9 L540.8 290.5 L530.9 272.4 L518.2 256.1 L503.3 241.9 L486.3 230.3 L467.6 221.4 L447.9 215.5 L427.4 212.7 L406.8 213.2 L386.5 216.8 L367.0 223.6 L348.8 233.3 L332.3 245.7 L318.0 260.5 L306.1 