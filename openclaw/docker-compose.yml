# The OpenClaw gateway, run as its own container.
#
# Nexus-Grid talks to this over HTTP; it does not embed it. The npm package is
# the gateway itself — 56 direct dependencies, a CLI, an onboarding wizard —
# and it declares a Node engine range this machine does not satisfy. A
# container sidesteps both: the gateway brings its own runtime, and the app's
# toolchain is untouched.
#
# Every command here needs `--env-file ../.env`, which the npm scripts supply:
#   npm run gateway:up | gateway:watch | gateway:down
#   npm run gateway:cli -- channels status
#
# The token lives once, in the project root .env, because the app presents it
# and the gateway validates it — one secret, two readers. Compose loads that
# file for interpolation only, and this file references exactly two variables,
# so nothing else in it reaches the container.
#
# First run — seed the config into the state volume. The gateway refuses to
# start without gateway.mode=local, and it owns the file afterwards (adding a
# channel rewrites it), so openclaw.json here is a seed, not the live copy:
#   docker compose -f openclaw/docker-compose.yml up -d
#   docker run --rm -v openclaw_openclaw-state:/state #     -v "$PWD/openclaw:/seed:ro" --entrypoint sh ghcr.io/openclaw/openclaw:latest #     -c 'cp /seed/openclaw.json /state/openclaw.json && chown node:node /state/openclaw.json'
#   docker compose -f openclaw/docker-compose.yml restart
#
# Then the WhatsApp channel, which is a plugin fetched at setup time:
#   …run --rm cli channels add --channel whatsapp --name "Nexus-Grid"
#   …run --rm cli channels login      # prints a QR — scan it from the phone
#
# Start:   docker compose -f openclaw/docker-compose.yml up -d
# Develop: docker compose -f openclaw/docker-compose.yml watch
# Status:  docker compose -f openclaw/docker-compose.yml run --rm cli channels status
# Health:  curl http://127.0.0.1:18789/healthz
services:
  gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    container_name: nexus-grid-openclaw
    restart: unless-stopped
    # `bind: lan` is load-bearing, not a widening. OpenClaw's default bind is
    # loopback, which inside a container means the container's own 127.0.0.1 —
    # traffic published by Docker arrives on eth0 and finds nothing listening.
    # The gateway's own docs call this out for exactly this setup. What keeps
    # it private is the host publish below, not the in-container bind.
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--auth", "token"]
    environment:
      # The shared secret Nexus-Grid presents as a bearer token. This endpoint
      # is full operator access on the gateway, which is why the port below is
      # bound to loopback only.
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in the project root .env}
    ports:
      # 127.0.0.1 deliberately, not 0.0.0.0: OpenClaw's own security note says
      # to keep this surface on loopback or a private ingress, never exposed.
      - "127.0.0.1:18789:18789"
    volumes:
      # openclaw.json, auth profiles, and the paired channel sessions. Without
      # these a restart loses the WhatsApp pairing and you scan the QR again.
      - openclaw-state:/home/node/.openclaw
      - openclaw-keys:/home/node/.config/openclaw
    # `docker compose -f openclaw/docker-compose.yml watch` — edit openclaw.json
    # here and the gateway picks it up and restarts, instead of the copy-in-and-
    # restart dance.
    #
    # This makes the file in this directory authoritative for gateway settings,
    # which is only safe because it is now complete: it carries the plugin
    # entry and the channel account as well as the policies. A partial seed
    # synced over the live config would disable the WhatsApp channel, since
    # sync replaces the file rather than merging into it.
    #
    # Pairing credentials and sessions are not in this file — they live
    # elsewhere in the state volume and are untouched by a sync.
    develop:
      watch:
        - action: sync+restart
          path: ./openclaw.json
          target: /home/node/.openclaw/openclaw.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot CLI against the same state, for onboarding and channel pairing.
  # Run with `--rm`; it is not a long-lived service.
  cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    profiles: ["cli"]
    entrypoint: ["openclaw"]
    depends_on:
      - gateway
    # Share the gateway's network namespace, so 127.0.0.1:18789 in here is the
    # gateway. Reaching it as ws://gateway:18789 across the compose network
    # instead trips OpenClaw's refusal to speak plaintext ws:// to a
    # non-loopback address — a refusal worth keeping rather than switching off
    # with OPENCLAW_ALLOW_INSECURE_PRIVATE_WS. This way the traffic really is
    # loopback and never crosses an interface, so nothing is being waived.
    network_mode: "service:gateway"
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
    volumes:
      - openclaw-state:/home/node/.openclaw
      - openclaw-keys:/home/node/.config/openclaw

volumes:
  openclaw-state:
  openclaw-keys:
