services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus
    volumes:
    - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/nexus
      - ENVIRONMENT=development
      - EVENT_BUS_BACKEND=memory
      - RATE_LIMIT_BACKEND=memory
      - CHECKPOINTER_BACKEND=memory
    ports:
      - "8005:8005"
    # --reload picks up files synced in by `docker compose watch`
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005 --reload
    develop:
      watch:
        # Live-sync application code; uvicorn --reload restarts workers
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: sync
          path: ./backend/alembic
          target: /app/alembic
        # Dependency or image changes need a full rebuild
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile

  frontend:
    build:
      context: ./frontend
    depends_on:
      - web
    environment:
      # Proxy /api/* to the backend container via Docker Compose service discovery.
      - BACKEND_URL=http://web:8005
    ports:
      - "5175:5173"
    develop:
      watch:
        # Live-sync source; Vite HMR picks up changes instantly
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        # Dependency or config changes need a full rebuild
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/vite.config.ts
        - action: rebuild
          path: ./frontend/Dockerfile

volumes:
  pgdata:
    driver: local
