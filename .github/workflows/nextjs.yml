# Deploy on every push to `main`: copy the source to the server and run
# `docker compose up -d --build` there, then verify the live console.
#
# The server runs exactly the stack docker-compose.yml describes (app +
# OpenClaw gateway sharing one network namespace, checkpoint DB on a named
# volume), plus Caddy for HTTPS from deploy/compose/docker-compose.prod.yml.
# One-time server setup is in deploy/compose/README.md.
#
# If the image build fails on the server, `up` stops before touching the
# running containers, so the previous release keeps serving.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VM_SSH_HOST     server hostname or IP, e.g. nexus.example.com
#   VM_SSH_USER     deploy user on the server (member of the docker group)
#   VM_SSH_KEY      ed25519 private key; public half in that user's authorized_keys
#   VM_PUBLIC_URL   https URL the verify step probes, e.g. https://nexus.example.com

name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Two deploys against the same server would race on the source directory and
# the compose project. The second queues; never cancel one mid-`up`.
concurrency:
  group: "server-deploy"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Same environment name as before, so secrets scoped to it still apply.
    environment:
      name: vm
    env:
      SSH_HOST: ${{ secrets.VM_SSH_HOST }}
      SSH_USER: ${{ secrets.VM_SSH_USER }}
      SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_PUBLIC_URL: ${{ secrets.VM_PUBLIC_URL }}
      APP_DIR: /opt/nexus-grid
      COMPOSE: docker compose -f docker-compose.yml -f deploy/compose/docker-compose.prod.yml
    steps:
      - name: Check secrets
        # Fail with a readable message instead of a bare exit 1 from ssh-keyscan.
        run: |
          missing=""
          for name in SSH_HOST SSH_USER SSH_KEY VM_PUBLIC_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing (the VM_ prefixed names; see deploy/compose/README.md)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            cat /tmp/keyscan.err
            echo "::error::Could not reach $SSH_HOST on port 22. Is the server up and the hostname right?"
            exit 1
          fi

      - name: Copy source to server
        # .env and the runtime state are excluded, and rsync never deletes an
        # excluded path, so the server's configuration survives every deploy.
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude .git --exclude node_modules --exclude .next \
            --exclude '.env' --exclude '.env.*' --exclude .nexus-grid \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Build and start
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" bash -s <<EOF
          set -euo pipefail
          cd "$APP_DIR"
          echo "$GITHUB_SHA" > REVISION
          $COMPOSE up -d --build --remove-orphans
          $COMPOSE ps
          docker image prune -f >/dev/null
          EOF

      - name: Verify
        run: |
          set -euo pipefail
          # The app waits on the gateway's healthcheck, so allow up to ~2 min.
          for endpoint in /api/health /api/health/db; do
            code=000
            for i in $(seq 1 60); do
              code=$(curl -sS -o /tmp/body -w '%{http_code}' "$VM_PUBLIC_URL$endpoint" || true)
              if [ "$code" = "200" ]; then
                echo "OK $endpoint (attempt $i)"; cat /tmp/body; echo
                break
              fi
              echo "wait $i: $endpoint -> $code"
              sleep 2
            done
            [ "$code" = "200" ] || { echo "::error::$endpoint never returned 200"; exit 1; }
          done
          # Single-process invariant (docs/ARCHITECTURE.md): two calls must
          # land in the same process or the in-memory singletons are split.
          pid1=$(curl -sS "$VM_PUBLIC_URL/api/health/db" | jq -r .pid)
          sleep 2
          pid2=$(curl -sS "$VM_PUBLIC_URL/api/health/db" | jq -r .pid)
          [ "$pid1" = "$pid2" ] || { echo "::error::pid changed: $pid1 -> $pid2"; exit 1; }
          echo "pid stable: $pid1"
