# /etc/nginx/sites-available/nexus-grid.conf — reverse proxy for the
# standalone Next.js server, with Let's Encrypt on the public listener.
#
# App binds 127.0.0.1:5180 (per nexus-grid.service HOSTNAME=127.0.0.1) and
# is never reachable except through this proxy.
#
# The /api/workflow/stream endpoint is Server-Sent Events. proxy_buffering
# off is required — without it nginx buffers the response and the console
# sees a stalled run. Splitting it into its own location block makes the
# requirement visible to future contributors; the global proxy_buffering
# off in the parent location is belt-and-braces.

# HTTP listener — only present so Let's Encrypt can issue the cert, and so
# ACME renewals keep working. Everything else redirects to HTTPS.
server {
    listen 80;
    server_name nexus.example.com;     # ← change to your hostname
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS listener — the real surface.
server {
    listen 443 ssl http2;
    server_name nexus.example.com;     # ← change to your hostname

    ssl_certificate     /etc/letsencrypt/live/nexus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexus.example.com/privkey.pem;

    # SSE-friendly defaults — apply to every proxied response.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_read_timeout 86400;

    # /api/workflow/stream is the SSE endpoint — explicit location block
    # makes the streaming requirement obvious.
    location /api/workflow/stream {
        proxy_pass http://127.0.0.1:5180;
    }

    location / {
        proxy_pass http://127.0.0.1:5180;
    }
}
